[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-mri-skull-stripping-evaluator"
version = "0.1.0"
description = "Beginner-friendly classical skull-stripping baselines for 2D brain MRI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scikit-image>=0.23,<1",
  "scipy>=1.12,<2",
  "nibabel>=5.2,<6",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
app = ["streamlit>=1.40,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["src*"]

