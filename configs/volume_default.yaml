normalization:
  lower_percentile: 1.0
  upper_percentile: 99.0

# These values are transferred from the frozen 2D configuration by applying
# the same fractions to 3D dimensions. They were not tuned on NFBS results.
morphology:
  opening_radius_fraction: 0.008
  closing_radius_fraction: 0.004
  minimum_component_volume_fraction: 0.005

central_component:
  centrality_weight: 0.75

# Optional exploratory fourth method. Coordinates assume closest-canonical RAS:
# left-right, posterior-anterior, inferior-superior. These values encode a
# deliberately coarse brain-location hypothesis and were not grid-searched.
spatial_prior:
  center_fraction: [0.50, 0.46, 0.61]
  radius_fraction: [0.39, 0.42, 0.34]
  inferior_exclusion_fraction: 0.25
  opening_radius_mm: 1.0
  closing_radius_mm: 2.0
  minimum_component_volume_ml: 1.0

evaluation:
  boundary_tolerance_voxels: 1.0
  bootstrap_samples: 1000
